<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- As the web's head: what Jonz is, the ground under each look, and
         installable, which is what lets an iPhone take reminders at all. The
         colours are Bin Night's backgrounds (a test keeps them equal). -->
    <meta name="description" content="Fair shares of the housework, and a house that keeps score." />
    <meta name="application-name" content="Jonz" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e7e9e5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111315" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Jonz" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The card a pasted link shows in iMessage, WhatsApp, Slack and X. These
         are every page's; a join link's card names its house, and link-preview
         bots get it from apps/api (vercel.json sends them there). -->
    <meta property="og:site_name" content="Jonz" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jonz" />
    <meta property="og:description" content="Fair shares of the housework, and a house that keeps score." />
    <meta property="og:image" content="https://jonz.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jonz: fair shares of the housework." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- While Jonz starts: the page's ground in the chosen look and the J sign
         in the middle, as the phone apps' splash and the app's StartSign
         (start-sign.tsx) draw it, so the start never flashes white. The
         look comes from the device's setting, or the one chosen in Jonz
         (hooks/look.tsx keeps it under "theme"). A test keeps these
         colours equal to Bin Night's and the sign equal to the app's. -->
    <script>
      try {
        var look = localStorage.getItem('theme');
        if (look === 'light' || look === 'dark') document.documentElement.setAttribute('data-look', look);
      } catch (e) {}
    </script>
    <style id="jonz-start">
      body { background-color: #e7e9e5; }
      .start { flex: 1; display: flex; align-items: center; justify-content: center; }
      .start svg { width: 96px; height: 96px; }
      .start .night { display: none; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-look='light']) body { background-color: #111315; }
        :root:not([data-look='light']) .start .day { display: none; }
        :root:not([data-look='light']) .start .night { display: block; }
      }
      :root[data-look='dark'] body { background-color: #111315; }
      :root[data-look='dark'] .start .day { display: none; }
      :root[data-look='dark'] .start .night { display: block; }
    </style>
  </head>

  <body>
    <noscript>Jonz needs JavaScript.</noscript>
    <div id="root">
      <div class="start" role="progressbar" aria-busy="true" aria-label="Jonz">
        <svg class="day" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#f6b800"/><rect x="104" y="104" width="304" height="304" rx="40" fill="none" stroke="#16181a" stroke-width="30"/><path transform="translate(47.325 23.525) scale(0.85)" d="M300 162 V300 C300 344 276 362 246 362 C214 362 196 344 190 314" fill="none" stroke="#16181a" stroke-width="54.118" stroke-linejoin="round"/></svg>
        <svg class="night" xmlns="http://www.w3.org/2000/svg" viewBox="77 77 358 358" aria-hidden="true"><rect x="104" y="104" width="304" height="304" rx="40" fill="none" stroke="#ffc21a" stroke-width="30"/><path transform="translate(47.325 23.525) scale(0.85)" d="M300 162 V300 C300 344 276 362 246 362 C214 362 196 344 190 314" fill="none" stroke="#ffc21a" stroke-width="54.118" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </body>
</html>
