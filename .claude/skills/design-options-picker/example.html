<title>Design picker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Overpass:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="picker.css">

<div id="picker"></div>

<script>
/* ---------- Example content: two made-up Jonz decisions, drawn in the Jonz brand ---------- */
var J = {
  sign: '<svg viewBox="0 0 512 512" width="100%" height="100%" aria-hidden="true"><rect x="104" y="104" width="304" height="304" rx="40" fill="none" stroke="currentColor" stroke-width="30"/><path transform="translate(47.325 23.525) scale(0.85)" d="M300 162 V300 C300 344 276 362 246 362 C214 362 196 344 190 314" fill="none" stroke="currentColor" stroke-width="54.118" stroke-linejoin="round"/></svg>',
  check: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M4.5 12.5l5 5L19.5 7"/></svg>',
  bigcheck: '<svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M4.5 12.5l5 5L19.5 7"/></svg>',
  clock: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.75" aria-hidden="true"><path d="M12 7v5.5l3.5 2"/><circle cx="12" cy="12" r="9"/></svg>',
  cam: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M3 7.5h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  search: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></svg>'
};
var LATER = [['MA', 'Wipe down the kitchen', 'Megan, Thu'], ['SL', 'Vacuum the stairs', 'Sam, Fri'], ['BK', 'Bathroom sink', 'Ben, Sat'], ['GF', 'Recycling', 'You, Sun', true]];
function rows(list) {
  return list.map(function (r) {
    return '<div class="row"><span class="av' + (r[3] ? ' me' : '') + '">' + r[0] + '</span><span class="w"><b>' + r[1] + '</b><small>' + r[2] + '</small></span>' + (r[4] || '') + '</div>';
  }).join('');
}

/* Item 1: Today */
function nextBlock(kind, done) {
  if (done) return '<div class="gname">Done today</div><div class="grp">' + rows([['GF', 'Bins out', 'You, on time at 16:42', true, '<span class="tick">' + J.check + '</span>']]) + '</div>';
  if (kind === 'a') return '<div class="signcard"><div class="legend"><span class="sh">' + J.sign + '</span><span class="nm">Bins out</span></div>' +
    '<div class="supp"><span>Yours tonight, due by 20:00</span><span class="chip">' + J.clock + '3h 20m</span></div>' +
    '<button class="done" data-go="next">' + J.check + 'Mark done</button></div>';
  if (kind === 'b') return '<div class="gname">Next up</div><div class="grp"><div class="row tint"><span class="av me">GF</span><span class="w"><b>Bins out</b><small>Yours, due by 20:00</small></span><button class="mini" data-go="next">' + J.check + 'Done</button></div></div>';
  if (kind === 'c') return '<div class="strip"><span class="k">Next up</span><span class="t"><b>Bins out</b> in 3h 20m</span><button class="done small" data-go="next">' + J.check + 'Done</button></div>';
  return '';
}
function laterRows(kind) {
  if (kind === 'now') return rows([['GF', 'Bins out', 'You, due by 20:00', true]].concat(LATER));
  return rows(LATER);
}
function today(kind, done) {
  return '<div class="app"><div class="status"></div><div class="tbar"><span class="ttl">Today</span><span class="date">Thu 5 Nov</span></div><div class="scroll">' +
    nextBlock(kind, done) + '<div class="gname">' + (kind === 'now' ? 'This week' : 'Later this week') + '</div><div class="grp">' + laterRows(kind) + '</div>' +
    '</div><nav class="tabs"><span class="on">Today</span><span>Week</span><span>House</span></nav></div>';
}
function sheet(kind) {
  return '<div class="app"><div class="under">' + today(kind) + '</div><div class="dim"></div>' +
    '<div class="sheet"><div class="grab"></div><div class="sh-title">Bins out</div><p class="sh-sub">Due by 20:00. Add a photo if the house asks for one.</p>' +
    '<button class="photo">' + J.cam + 'Add a photo</button>' +
    '<div class="sh-row"><button class="ghostbtn" data-go="1">Not yet</button><button class="done" data-go="next">' + J.check + 'Done it</button></div></div></div>';
}
function ticked() {
  return '<div class="app center"><div class="burst">' + J.bigcheck + '</div><div class="ttl">Bins out, done</div><p class="sh-sub">On time. Megan and Sam will see it on the Wall.</p><button class="done wide" data-go="start">Back to Today</button></div>';
}
function lapToday(kind, done) {
  return '<div class="app lap"><aside class="rail"><div class="lock"><span class="tile">' + J.sign + '</span>JONZ</div><div class="nav"><span class="on">Today</span><span>Week</span><span>House</span></div></aside>' +
    '<main class="lmain"><div class="tbar"><span class="ttl">Today</span><span class="date">Thu 5 Nov, The Terrace</span></div><div class="cols">' +
    '<div class="col">' + nextBlock(kind, done) + '<div class="gname">Later this week</div><div class="grp">' + laterRows(kind) + '</div>' + (done ? '<button class="ghostbtn back" data-go="start">Start again</button>' : '') + '</div>' +
    '<div class="col"><div class="gname">The Wall</div><div class="grp">' + rows([['MA', 'Megan ticked Wipe down the kitchen', 'On time at 13:02'], ['SL', 'Sam flagged Bins for you', 'At 14:10'], ['BK', 'Ben earned immunity', '4 clean weeks, yesterday']]) + '</div>' +
    '<div class="gname">This week</div><div class="grp">' + rows([['GF', 'You: 3 of 5 done', 'Fair share 5', true], ['MA', 'Megan: 4 of 4 done', 'Fair share 4']]) + '</div></div>' +
    '</div></main></div>';
}
function flow(kind) {
  return {
    phone: [{ label: 'Today', html: today(kind) }, { label: 'Mark done', html: sheet(kind) }, { label: 'Done', html: ticked() }],
    laptop: [{ label: 'Today', html: lapToday(kind) }, { label: 'Done', html: lapToday(kind, true) }]
  };
}

/* Item 2: Owner admin, People */
var PEOPLE = [['Ada Lovelace', 'ada@example.com', 'The Terrace', 'House Pass', 'Today'], ['Ben Kaye', 'ben@example.com', 'The Terrace', 'Free', '2 days ago'],
  ['Chloe Park', 'chloe@example.com', 'Elm Road', 'Founding', 'Today'], ['Dev Shah', 'dev@example.com', 'Elm Road', 'Free', '3 weeks ago'],
  ['Priya Singh', 'priya@example.com', 'Kings Yard', 'House Pass', 'Yesterday'], ['Sam Lee', 'sam@example.com', 'The Terrace', 'Free', 'Today']];
function adminShell(inner, phone) {
  if (phone) return '<div class="app"><div class="status"></div><div class="tbar"><span class="ttl">People</span><span class="date">Owner admin</span></div><div class="scroll">' + inner + '</div></div>';
  return '<div class="app lap"><aside class="rail"><div class="lock"><span class="tile">' + J.sign + '</span>ADMIN</div><div class="nav"><span>Overview</span><span class="on">People</span><span>Houses</span><span>Payments</span><span>Reports</span></div></aside>' +
    '<main class="lmain"><div class="tbar"><span class="ttl">People</span><span class="date">2,418 people</span></div>' + inner + '</main></div>';
}
function search(phone) {
  return '<div class="searchrow"><div class="search">' + J.search + '<span>Search name, email or house</span></div>' + (phone ? '' : '<span class="filt on">Everyone</span><span class="filt">House Pass</span><span class="filt">Free</span><span class="filt">Not seen in 2 weeks</span>') + '</div>' + (phone ? '<div class="filters"><span class="filt on">Everyone</span><span class="filt">House Pass</span><span class="filt">Free</span></div>' : '');
}
function adminTable() {
  return search(false) + '<div class="grp"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>House</th><th>Plan</th><th>Last seen</th></tr></thead><tbody>' +
    PEOPLE.map(function (p) { return '<tr data-go="next"><td><b>' + p[0] + '</b></td><td>' + p[1] + '</td><td>' + p[2] + '</td><td>' + p[3] + '</td><td>' + p[4] + '</td></tr>'; }).join('') + '</tbody></table></div>';
}
function adminRows(phone) {
  return search(phone) + '<div class="grp">' + PEOPLE.map(function (p) {
    return '<div class="row" data-go="next"><span class="av">' + p[0].split(' ').map(function (x) { return x[0]; }).join('') + '</span><span class="w"><b>' + p[0] + '</b><small>' + p[2] + ', ' + p[3] + '</small></span><small class="seen">' + p[4] + '</small></div>';
  }).join('') + '</div>';
}
function person(phone) {
  var inner = '<button class="ghostbtn back" data-go="back">‹ People</button><div class="cols' + (phone ? ' one' : '') + '"><div class="col"><div class="gname">Ada Lovelace</div><div class="grp">' +
    rows([['AL', 'ada@example.com', 'Signed in with Google'], ['TT', 'The Terrace', 'Admin, 4 housemates'], ['HP', 'House Pass', 'Renews 3 Mar 2027']]) + '</div></div>' +
    '<div class="col"><div class="gname">Actions</div><div class="grp">' + rows([['', 'Send a sign-in link', 'By email'], ['', 'Move to another house', 'Keeps their record'], ['', 'Delete account', 'Can be undone for 30 days']]) + '</div></div></div>';
  return adminShell(inner, phone);
}
function nowAdmin(phone) {
  return adminShell('<div class="grp">' + PEOPLE.slice(0, 5).map(function (p) { return '<div class="row" data-go="next"><span class="w"><b>' + p[1] + '</b></span></div>'; }).join('') + '</div><p class="sh-sub" style="padding:12px 16px">Showing 50 of 2,418. No search yet.</p>', phone);
}

window.PICKER = {
  project: 'Jonz: a made-up sample',
  title: 'Today and the admin People page',
  intro: 'This is <b>made-up sample content</b> to show the picker. It holds two separate things to decide, switched at the top. Each option can have several screens, and <b>Live preview</b> lets you tap through one.',
  theme: {
    font: '"Overpass", "Helvetica Neue", Arial, sans-serif',
    display: '"Overpass", "Arial Black", Arial, sans-serif',
    titleCase: 'uppercase', titleWeight: 900,
    light: { bg: '#e7e9e5', surface: '#f7f8f5', sunk: '#dde0db', fg: '#16181a', muted: '#596066', line: '#c5c9c3', accent: '#16181a', onAccent: '#f7f8f5', rec: '#f6b800', onRec: '#16181a', bezel: '#16181a' },
    dark: { bg: '#111315', surface: '#1a1d20', sunk: '#24282c', fg: '#edefeb', muted: '#99a0a5', line: '#2c3135', accent: '#ffc21a', onAccent: '#111315', rec: '#ffc21a', onRec: '#111315', bezel: '#2c3135' }
  },
  looks: ['day', 'night'],
  view: 'stage',
  css: [
    ':host{--bg:#e7e9e5;--card:#f7f8f5;--sec:#dde0db;--fg:#16181a;--muted:#596066;--line:#c5c9c3;--amber:#f6b800;--on-amber:#16181a;--good:#2e7d32;--tint:rgba(246,184,0,.18);--tar:#16181a;--on-tar:#edefeb;font-family:Overpass,Arial,sans-serif;color:var(--fg)}',
    ':host(.night){--bg:#111315;--card:#1a1d20;--sec:#24282c;--fg:#edefeb;--muted:#99a0a5;--line:#2c3135;--amber:#ffc21a;--on-amber:#111315;--good:#6cc070;--tint:rgba(255,194,26,.12);--tar:#24282c;--on-tar:#edefeb}',
    'button{font-family:inherit;cursor:pointer}[data-go]{cursor:pointer}',
    '.app{width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}',
    '.status{height:47px;flex:none}',
    '.tbar{display:flex;align-items:baseline;gap:10px;padding:6px 20px 14px}',
    '.ttl{font-weight:900;font-size:30px;line-height:34px;text-transform:uppercase;letter-spacing:.02em}',
    '.date{color:var(--muted);font-size:15px}',
    '.scroll{flex:1;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:10px}',
    '.gname{font-weight:700;font-size:15px;padding:10px 0 0 16px}',
    '.grp{background:var(--card);border-radius:12px;overflow:hidden}',
    '.row{display:flex;gap:14px;align-items:center;padding:12px 14px 12px 16px;min-height:62px;position:relative}',
    '.row+.row::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--line)}',
    '.row.tint{background:var(--tint)}',
    '.av{width:32px;height:32px;border-radius:50%;background:var(--sec);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;padding-top:2px}',
    '.av:empty{background:transparent}',
    '.av.me{background:var(--fg);color:var(--bg)}',
    '.w{display:flex;flex-direction:column;flex:1;min-width:0}.w b{font-weight:700;font-size:17px;line-height:22px}.w small{color:var(--muted);font-size:14px}',
    '.tick{width:28px;height:28px;border-radius:7px;background:var(--good);color:var(--bg);display:grid;place-items:center}',
    '.signcard{background:var(--amber);color:var(--on-amber);border-radius:12px;padding:14px;box-shadow:inset 0 0 0 3px var(--amber),inset 0 0 0 5.5px var(--on-amber);display:flex;flex-direction:column;gap:12px}',
    ':host(.night) .signcard{background:var(--card);color:var(--amber);box-shadow:inset 0 0 0 2.5px var(--amber)}',
    '.legend{display:flex;align-items:center;gap:12px}.sh{width:44px;height:44px;flex:none;margin:-4px}',
    '.nm{font-weight:900;font-size:30px;line-height:32px;text-transform:uppercase;padding-top:4px}',
    '.supp{background:var(--card);color:var(--fg);border-radius:8px;padding:10px 12px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;box-shadow:inset 0 0 0 1.5px var(--on-amber)}',
    ':host(.night) .supp{background:var(--sec);box-shadow:none}',
    '.chip{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;padding:3px 8px 1px;border-radius:6px;background:var(--amber);color:var(--on-amber);box-shadow:inset 0 0 0 1.5px var(--on-amber);white-space:nowrap}',
    '.done{font:800 17px Overpass,Arial,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border:0;border-radius:10px;background:var(--fg);color:var(--bg);padding:3px 20px 0}',
    ':host(.night) .done{background:var(--amber);color:var(--on-amber)}',
    '.done.small{height:40px;padding:3px 14px 0;font-size:15px;background:var(--amber);color:var(--on-amber)}',
    '.done.wide{align-self:stretch;margin:0 24px}',
    '.mini{font:800 14px Overpass,Arial,sans-serif;display:flex;align-items:center;gap:4px;height:36px;padding:3px 12px 0;border:0;border-radius:8px;background:var(--amber);color:var(--on-amber);box-shadow:inset 0 0 0 1.5px var(--on-amber)}',
    '.strip{background:var(--tar);color:var(--on-tar);border-radius:12px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:12px}',
    '.strip .k{font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);flex:none}.strip .t{flex:1;font-size:16px}',
    '.tabs{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:10px 0 34px;font-weight:700;font-size:13px;color:var(--muted);background:var(--bg)}.tabs .on{color:var(--fg)}',
    '.under{position:absolute;inset:0}.dim{position:absolute;inset:0;background:rgba(0,0,0,.45)}',
    '.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;padding:10px 20px 40px;display:flex;flex-direction:column;gap:14px}',
    '.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}',
    '.sh-title{font-weight:900;font-size:26px;text-transform:uppercase;padding-top:6px}',
    '.sh-sub{color:var(--muted);font-size:15px;margin:0}',
    '.photo{display:flex;align-items:center;justify-content:center;gap:8px;height:88px;border:1.5px dashed var(--line);border-radius:10px;background:transparent;color:var(--fg);font:700 15px Overpass,Arial,sans-serif}',
    '.sh-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}',
    '.ghostbtn{height:52px;border:0;border-radius:10px;background:var(--sec);color:var(--fg);font:800 17px Overpass,Arial,sans-serif;padding:3px 16px 0}',
    '.ghostbtn.back{height:40px;font-size:15px;align-self:flex-start;margin:0 0 12px}',
    '.center{align-items:center;justify-content:center;gap:14px;text-align:center}',
    '.burst{width:96px;height:96px;border-radius:24px;background:var(--good);color:var(--bg);display:grid;place-items:center}',
    '.lap{flex-direction:row}',
    '.rail{width:232px;flex:none;padding:24px 16px;display:flex;flex-direction:column;gap:24px;border-right:1px solid var(--line)}',
    '.lock{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;padding-left:8px}.tile{width:34px;height:34px;border-radius:8px;background:var(--amber);color:var(--on-amber);display:block}',
    ':host(.night) .tile{background:var(--on-amber);color:var(--amber)}',
    '.nav{display:flex;flex-direction:column;gap:4px}.nav span{padding:10px 12px 8px;border-radius:6px;font-weight:700;color:var(--muted)}.nav .on{background:var(--sec);color:var(--fg)}',
    '.lmain{flex:1;min-width:0;padding:32px 40px;display:flex;flex-direction:column}.lmain .tbar{padding:0 0 18px 16px}',
    '.cols{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}.cols.one{grid-template-columns:1fr;gap:6px}.col{display:flex;flex-direction:column;gap:10px}',
    '.lap .signcard .done{align-self:flex-start;padding:3px 28px 0}',
    '.searchrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}',
    '.search{flex:1;min-width:220px;display:flex;gap:8px;align-items:center;height:44px;padding:0 14px;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font-size:15px}',
    '.filters{display:flex;gap:6px;margin:-4px 0 4px}',
    '.filt{font-weight:700;font-size:14px;padding:8px 12px 6px;border-radius:999px;background:var(--sec);color:var(--fg)}.filt.on{background:var(--fg);color:var(--bg)}',
    '.tbl{width:100%;border-collapse:collapse;font-size:15px}.tbl th{text-align:left;color:var(--muted);font-weight:700;font-size:13px;padding:12px 16px 8px}.tbl td{padding:14px 16px 12px;border-top:1px solid var(--line)}.tbl tr[data-go]:hover td{background:var(--tint)}',
    '.seen{color:var(--muted);font-size:13px;white-space:nowrap}'
  ].join('\n'),
  items: [
    { id: 'today', name: 'Today',
      question: 'Which way should Today show your next John?',
      recommended: 'a', why: 'It is the one thing you need to do, posted like a sign, with the button right under it.',
      options: [
        { id: 'now', now: true, name: 'As it is now', summary: 'Your John sits in the week\'s list like everyone else\'s.', liveUrl: 'https://jonz.app',
          screens: { phone: today('now'), laptop: lapToday('now') } },
        { id: 'a', name: 'Sign card', summary: 'Your next John sits at the top as an amber road sign, with the time left and a Mark done button under it.',
          good: ['Impossible to miss, and it is the brand\'s own sign.', 'One big button to tap.'], watch: ['Takes about a third of a phone screen.'],
          screens: flow('a') },
        { id: 'b', name: 'Top of the list', summary: 'No card. Your John is the first row, on an amber tint, with a small Done button.',
          good: ['Quietest. Shows the most Johns at once.'], watch: ['Easy to skim past.', 'Smaller button.'],
          screens: flow('b') },
        { id: 'c', name: 'Countdown strip', summary: 'A dark strip at the top counts down to your next John, with Done at the end.',
          good: ['Short, and the countdown adds urgency.'], watch: ['Dark strip reads like a warning.'],
          screens: flow('c') }
      ] },
    { id: 'admin', name: 'Admin: People',
      question: 'How should the admin People page list everyone?',
      recommended: 'a', why: 'A table scans fastest when there are thousands of people, and it turns into rows on a phone.',
      options: [
        { id: 'now', now: true, name: 'As it is now', summary: 'A plain list of emails, 50 at a time, with no search.',
          screens: { laptop: [{ label: 'People', html: nowAdmin(false) }, { label: 'A person', html: person(false) }], phone: [{ label: 'People', html: nowAdmin(true) }, { label: 'A person', html: person(true) }] } },
        { id: 'a', name: 'Table with filters', summary: 'One search box and filter chips over a table. Tap a person to open them.',
          good: ['Matches the admin rule: one search and filters on every list.', 'Fits 20 people on a laptop screen.'], watch: ['Columns become rows on a phone.'],
          screens: { laptop: [{ label: 'People', html: adminShell(adminTable()) }, { label: 'A person', html: person(false) }], phone: [{ label: 'People', html: adminShell(adminRows(true), true) }, { label: 'A person', html: person(true) }] } },
        { id: 'b', name: 'Rows like the app', summary: 'The same grey groups and rows as the app, with search on top.',
          good: ['Looks like the rest of Jonz.'], watch: ['Shows about half as many people at once.'],
          screens: { laptop: [{ label: 'People', html: adminShell(adminRows(false)) }, { label: 'A person', html: person(false) }], phone: [{ label: 'People', html: adminShell(adminRows(true), true) }, { label: 'A person', html: person(true) }] } }
      ] }
  ]
};
</script>
<script src="picker.js"></script>
