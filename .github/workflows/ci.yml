name: CI

# Vercel and Supabase deploy `main` (and `preview`) from their own GitHub
# integrations, so this workflow ships nothing. It is the proof: keep it a
# required status check, because a merge is the only thing that reaches a
# release branch and a deploy follows it unconditionally.
#
# The jobs run side by side, and `verify` (the required check) passes only
# when every one of them did and the count guard finds every test ran:
#
#   checks          lint, code standards, typecheck, unit tests, /v1 contract, deal breaks
#   client          the native app's own proof
#   db (1/2, 2/2)   database tests, half the files each, own Supabase each
#   e2e (<device>)  one job per device in playwright.config.ts, own Supabase each
#   verify          the gate
#
# Every job that needs a database starts its own fresh local stack
# (.github/actions/local-supabase), so no job sees another's rows, exactly as
# when everything ran on one machine one step at a time.
#
# It runs on pull requests only, not again after a merge. main requires
# `verify` and requires the branch to be up to date with main before it can
# merge, so the merged commit is exactly what was just proved; a second run
# on main would prove it twice (it used to be about a third of all CI
# minutes). Run it by hand (Actions, CI, Run workflow) to re-check a branch.
on:
  pull_request:
    branches: [main, preview]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Read by supabase/config.toml; the suites never sign in with Google.
  AUTH_GOOGLE_CLIENT_ID: ci
  AUTH_GOOGLE_SECRET: ci

jobs:
  # Pure rules and static checks: no database, so they never wait for one.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Size, dead code, repeats, import circles and the real clock in tests:
      # docs/standards/code.md. Old breaks are listed; the list only shrinks.
      - name: Code standards
        run: npm run code:standards

      - name: Unit tests
        run: npm test

      # Within /v1 the contract only grows: nothing removed, renamed, retyped or
      # newly required (docs/specs/api.md). A break is /v2. The unit tests
      # already fail if apps/v1/openapi.json is out of date with the code.
      - name: API contract only adds
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if ! git show "origin/${{ github.base_ref }}:apps/v1/openapi.json" > /tmp/openapi-base.json 2>/dev/null; then
            echo "No /v1 contract on ${{ github.base_ref }} yet: nothing to compare."
            exit 0
          fi
          docker run --rm -v /tmp:/base -v "$PWD/apps/v1:/head" tufin/oasdiff:v1.37.0 \
            breaking /base/openapi-base.json /head/openapi.json --fail-on ERR --format githubactions \
            --err-ignore /head/oasdiff-ignore.txt

      # The deal's deliberate breaks still fit its code (running them all takes minutes: npm run breaks -w @app/core).
      - name: Deal breaks fit
        run: npm run breaks -w @app/core -- --check

      - name: Typecheck
        run: npm run typecheck

  # RLS is the only real enforcement, so the adversarial suites gate. Vitest
  # shards by file; inside a shard it is still one file at a time against
  # that shard's own stack. Each shard writes a JSON report for the guard.
  db:
    name: db (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: ./.github/actions/local-supabase

      # Every table, pointer, index and time follows docs/standards/database.md.
      - name: Database standards
        if: matrix.shard == 1
        run: npm run db:standards

      # Supabase's own security and performance advisors: any warning fails.
      - name: Database advisors
        if: matrix.shard == 1
        run: npm run db:advisors

      # `npm run test:db` locally runs the same three workspaces in one go.
      - name: Database tests
        run: |
          R="$GITHUB_WORKSPACE/db-reports"
          mkdir -p "$R"
          db() { (cd "$1" && npx vitest run --project db --reporter=default --reporter=json --outputFile.json="$R/$2.json" "${@:3}"); }
          if [ "${{ matrix.shard }}" = 1 ]; then
            db packages/server server
            db apps/v1 v1
          fi
          db apps/api api-${{ matrix.shard }} --shard=${{ matrix.shard }}/2

      # Not a dot-folder: upload-artifact leaves hidden paths out.
      - name: Upload test counts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: db-results-${{ matrix.shard }}
          path: db-reports/
          retention-days: 7

  # Both web apps, once per device in playwright.config.ts: the Next app, and
  # the Expo app's web build, which Playwright exports against this job's
  # stack and serves on 8205. Each job installs only its own browser.
  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: android-chrome
            browser: chromium
          - project: iphone-safari
            browser: webkit
          - project: desktop-firefox
            browser: firefox
          - project: laptop-chrome
            browser: chromium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: ./.github/actions/local-supabase

      - name: Build
        run: npm run build

      # The system libraries come from Ubuntu's mirror, which has been slow
      # (12.5 minutes for WebKit's once), so the .deb files are cached. The
      # key holds the runner image's version: a new image starts a new cache,
      # so the cached packages always match what the image already has.
      - name: Browser system libraries cache key
        id: apt-key
        run: echo "key=apt-${ImageOS}-${ImageVersion}-${{ matrix.browser }}-pw$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore browser system libraries
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: ${{ steps.apt-key.outputs.key }}

      - name: Install browser system libraries
        timeout-minutes: 15
        run: |
          debs="$HOME/apt-debs"
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" = "true" ] && ls "$debs"/*.deb > /dev/null 2>&1; then
            if sudo DEBIAN_FRONTEND=noninteractive dpkg -i "$debs"/*.deb > /tmp/dpkg.log 2>&1; then
              echo "Installed $(ls "$debs"/*.deb | wc -l) cached packages."
              exit 0
            fi
            tail -20 /tmp/dpkg.log
            echo "::warning title=Cached libraries::dpkg could not install the cache; fetching from the mirror"
          fi
          # Keep every package apt downloads, in a folder the cache can save.
          mkdir -p "$debs/partial"
          echo "Dir::Cache::Archives \"$debs/\";" | sudo tee /etc/apt/apt.conf.d/99-ci-keep-debs > /dev/null
          npx playwright install-deps ${{ matrix.browser }}
          sudo rm -rf "$debs/partial" "$debs/lock"
          sudo chown -R "$USER" "$debs"
          echo "Fetched $(ls "$debs"/*.deb 2>/dev/null | wc -l) packages from the mirror."

      # Saved now, not at job end, so a red test run still keeps it.
      - name: Save browser system libraries
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: ${{ steps.apt-key.outputs.key }}

      - name: Install browser
        run: |
          for attempt in 1 2; do
            timeout 300 npx playwright install ${{ matrix.browser }} && exit 0
            echo "::warning title=Browser download::attempt $attempt failed or took over 5 minutes"
          done
          exit 1

      # About six minutes when green; a run stuck past twenty is failing.
      - name: End-to-end
        timeout-minutes: 20
        run: npm run test:e2e -- --project=${{ matrix.project }}
        env:
          CI: "1"

      - name: Upload test counts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.project }}
          path: apps/api/e2e-results.json
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            apps/api/playwright-report/
            apps/api/test-results/
          retention-days: 7

  # The native app's own proof, beside the rest. `checks` already lints,
  # typechecks and tests every workspace (the client's Jest and its emoji scan
  # included). This job does what only the client needs.
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Two copies of React break hooks at runtime, and legacy-peer-deps hides
      # the conflicts that cause them. The root `overrides` pin the Expo SDK's
      # version; this proves npm installed just that one.
      - name: One React
        run: |
          copies=$(find . -path ./.git -prune -o \( -path '*/node_modules/react/package.json' -o -path '*/node_modules/react-dom/package.json' \) -print)
          echo "$copies"
          if [ "$(wc -l <<<"$copies")" -ne 2 ]; then
            echo "::error title=More than one React::npm installed react or react-dom more than once; run npm dedupe"
            exit 1
          fi
          node -p "'react ' + require('react/package.json').version + ', react-dom ' + require('react-dom/package.json').version"

      - name: Web export
        run: npm run export:web -w apps/client

      # Pinned, like the Supabase CLI: a new doctor can fail a commit that
      # changed nothing. Bump it deliberately.
      - name: Expo doctor
        working-directory: apps/client
        run: npx -y expo-doctor@1.21.5

  # The required status check. `always()` so that a failed or cancelled job
  # makes this red: a skipped required check would count as passing.
  verify:
    if: always()
    needs: [checks, db, e2e, client]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error title=CI failed::a job above did not pass"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-results-*"
          path: .ci-reports

      # Every test Playwright knows of, on every device: listing loads the
      # specs without a stack, so the keys only need to be present.
      - name: Every end-to-end test ran
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54341
          NEXT_PUBLIC_SUPABASE_ANON_KEY: list-only
          SUPABASE_SERVICE_ROLE_KEY: list-only
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/.ci-reports/e2e-listed.json
        run: |
          (cd apps/api && npx playwright test --list --reporter=json > /dev/null)
          node scripts/ci/count-guard.mjs e2e .ci-reports/e2e-listed.json .ci-reports/e2e-results-*/e2e-results.json

      - name: Every database test file ran
        run: node scripts/ci/count-guard.mjs db . .ci-reports/db-results-*/*.json
