name: CI

# Vercel and Supabase deploy `main` (and `preview`) from their own GitHub
# integrations, so this workflow ships nothing. It is the proof: keep it a
# required status check, because a merge is the only thing that reaches a
# release branch and a deploy follows it unconditionally.
on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Read by supabase/config.toml; the suites never sign in with Google.
      AUTH_GOOGLE_CLIENT_ID: ci
      AUTH_GOOGLE_SECRET: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Pure rules first: the whole tier costs less than one `supabase start`.
      - name: Unit tests
        run: npm test

      # The deal's deliberate breaks still fit its code (running them all takes minutes: npm run breaks -w @app/core).
      - name: Deal breaks fit
        run: npm run breaks -w @app/core -- --check

      - name: Typecheck
        run: npm run typecheck

      # Pinned, as in pub-golf: the CLI version decides what a fresh database
      # hands a table before any migration runs. Bump it deliberately.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start local Supabase
        run: |
          supabase start -x studio,edge-runtime,logflare,vector,imgproxy,mailpit,supavisor
          supabase db reset

      # The Next app reads its settings from its own directory.
      - name: Point the app at local Supabase
        run: |
          STATUS=$(supabase status -o json)
          API_URL=$(jq -r '.API_URL // empty' <<<"$STATUS")
          ANON=$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY // empty' <<<"$STATUS")
          SERVICE=$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // empty' <<<"$STATUS")
          missing=""
          [ -n "$API_URL" ] || missing="$missing API_URL"
          [ -n "$ANON" ]    || missing="$missing ANON_KEY"
          [ -n "$SERVICE" ] || missing="$missing SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Supabase status is missing keys::$missing"
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3205"
            echo "CRON_SECRET=ci-tick-secret"
            echo "ALLOWED_ORIGINS=http://localhost:8205"
          } > apps/api/.env.local

      # Every table, pointer, index and time follows docs/standards/database.md.
      - name: Database standards
        run: npm run db:standards

      # RLS is the only real enforcement, so the adversarial suites gate.
      - name: Database tests
        run: npm run test:db

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      # Both web apps: the Next app, and the Expo app's web build, which
      # Playwright exports against this stack and serves on 8205.
      # About ten minutes when green; a run stuck past twenty is failing.
      - name: End-to-end (phones and a laptop)
        timeout-minutes: 20
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/api/playwright-report/
            apps/api/test-results/
          retention-days: 7

  # The native app's own proof, beside `verify`, whose root lint, typecheck
  # and test already run every workspace (the client's Jest and its emoji
  # scan included). This job does what only the client needs.
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Two copies of React break hooks at runtime, and legacy-peer-deps hides
      # the conflicts that cause them. The root `overrides` pin the Expo SDK's
      # version; this proves npm installed just that one.
      - name: One React
        run: |
          copies=$(find . -path ./.git -prune -o \( -path '*/node_modules/react/package.json' -o -path '*/node_modules/react-dom/package.json' \) -print)
          echo "$copies"
          if [ "$(wc -l <<<"$copies")" -ne 2 ]; then
            echo "::error title=More than one React::npm installed react or react-dom more than once; run npm dedupe"
            exit 1
          fi
          node -p "'react ' + require('react/package.json').version + ', react-dom ' + require('react-dom/package.json').version"

      - name: Web export
        run: npm run export:web -w apps/client

      # Pinned, like the Supabase CLI: a new doctor can fail a commit that
      # changed nothing. Bump it deliberately.
      - name: Expo doctor
        working-directory: apps/client
        run: npx -y expo-doctor@1.21.5
